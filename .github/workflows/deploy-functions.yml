# One-click deploy of CUDFIRM's Supabase functions and secrets from GitHub (no computer tools needed).
# Run it from the GitHub "Actions" tab -> "Deploy Supabase functions" -> "Run workflow".
name: Deploy Supabase functions
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Save secrets in Supabase
        run: |
          supabase secrets set --yes --project-ref "$REF" \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            ADMIN_NOTIFY_EMAIL="${{ secrets.ADMIN_NOTIFY_EMAIL }}" \
            MEMBER_EMAIL_WEBHOOK_SECRET="${{ secrets.EMAIL_SECRET }}" \
            MEMBER_EMAIL_WEBHOOK_URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/send-email-resend" \
            ENQUIRY_WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}" \
            MEMBER_SITE_URL="${{ secrets.SITE_URL }}" \
            MEMBER_ALLOWED_ORIGINS="${{ secrets.SITE_URL }}" \
            BLOG_WEBHOOK_SECRET="${{ secrets.BLOG_WEBHOOK_SECRET }}" \
            UNSUBSCRIBE_SECRET="${{ secrets.UNSUBSCRIBE_SECRET }}" \
            RESEND_FROM="${{ secrets.RESEND_FROM }}"
      - name: Deploy functions
        run: |
          for f in service-request enquiry-notify send-email-resend blog-notify newsletter-unsubscribe; do
            supabase functions deploy "$f" --project-ref "$REF" --no-verify-jwt
          done

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CUDFIRM Inc. — Official Terms and Conditions. Lagos, Nigeria.">
  <title>CUDFIRM  GROUP— Terms &amp; Conditions</title>
  <!-- Font Awesome for icons only (cached on CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/terms.css">
</head>
<body>

  <!-- ── MOBILE HEADER ── -->
  <header class="mob-header" role="banner">
    <div class="brand"><span class="bp">//</span><span class="bn">CUDFIRM</span><span class="bs">_docs</span></div>
    <div class="mob-actions">
      <button id="mobHomeBtn" class="icon-btn" aria-label="Return to cover page" title="Home">
        <i class="fa fa-home" aria-hidden="true"></i>
      </button>
      <button class="icon-btn" aria-label="CUDFIRM Blue Print" title="BluePrint">
        <i class="fa fa-map" aria-hidden="true"></i>
      </button>
      <button class="icon-btn" aria-label="Sign In" title="SignIn">
        <i class="fa fa-user-circle-o" aria-hidden="true"></i>
      </button>
      <button id="hamBtn" class="ham" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar" aria-haspopup="true">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <!-- Overlay (closes sidebar on tap) -->
  <div id="overlay" class="overlay" aria-hidden="true" role="presentation"></div>

  <!-- ── APP SHELL ── -->
  <div class="app">

    <!-- SIDEBAR -->
    <nav id="sidebar" class="sidebar" role="navigation" aria-label="Document section navigation">
      <div class="sb-inner">
        <div class="sb-brand" aria-hidden="true">
          <span class="bp">//</span><span class="bn">CUDFIRM</span><span class="bs">_docs</span>
        </div>
        <div class="doc-meta" role="complementary" aria-label="Document metadata">
          <div class="mr"><span class="mk">DOC_TYPE</span><span class="mv">Legal / T&amp;C</span></div>
          <div class="mr"><span class="mk">VERSION</span> <span class="mv">2.0.1</span></div>
          <div class="mr"><span class="mk">PAGES</span>   <span class="mv" id="pgCount">12</span></div>
        </div>
        <p class="toc-hd" aria-hidden="true">SECTIONS</p>
        <!-- TOC injected by JS -->
        <ul id="tocList" class="toc" role="list" aria-label="Table of contents"></ul>
        <div class="sb-foot">© 2025 CUDFIRM Inc. · Lagos, Nigeria</div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main" role="main" aria-label="Document viewer">

      <!-- Top control bar -->
      <div class="top-bar" role="toolbar" aria-label="Document controls">
        <button id="closeBookBtn" class="ctrl-btn" aria-label="Close book and return to cover">
          <i class="fa fa-compress" aria-hidden="true"></i> Close Book
        </button>
        <span id="pgCounter" class="pg-counter" aria-live="polite" aria-atomic="true">01 / 12</span>
      </div>

      <!-- Book viewport -->
      <div class="book-wrap">
        <!-- Pages injected by JS -->
        <div id="notebook" role="region" aria-label="Document pages" aria-live="polite"></div>
      </div>
<br/>
      <!-- Mobile bottom nav bar -->
      <nav class="mob-nav" role="navigation" aria-label="Page controls">
        <button onclick="navigateBack()"   aria-label="Previous page"><i class="fa fa-chevron-left"  aria-hidden="true"></i></button>
        <button id="mobTocBtn"             aria-label="Open contents menu"><i class="fa fa-list" aria-hidden="true"></i><span>Contents</span></button>
        <button onclick="navigateTo(0)"    aria-label="Return to cover"><i class="fa fa-home"         aria-hidden="true"></i><span>Home</span></button>
        <button onclick="navigateForward()" aria-label="Next page"><i class="fa fa-chevron-right" aria-hidden="true"></i></button>
      </nav>

    </main>
  </div><!-- /.app -->

  <script src="js/terms2.js"></script>
</body>
</html>

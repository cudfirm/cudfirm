<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Home · CUDFIRM Admin</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" />
<link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="dash-body">

<div id="dash-shell"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/layout.js"></script>
<script src="js/dashboard-api.js"></script>

<script>
  document.addEventListener("dash:authenticated", async () => {
    DashLayout.render({ active: "home", title: "Dashboard Home", icon: "bi-house-door" });
    await renderHome();
  });

  async function renderHome() {
    const root = document.getElementById("page-content");
    root.innerHTML = `
      <div class="stat-grid" id="statGrid">
        <div class="loading-state" style="grid-column:1/-1"><i class="bi bi-arrow-repeat"></i> Loading overview…</div>
      </div>
      <h2 class="h5 mb-3 mt-4">Quick edit</h2>
      <div class="quick-links">
        <a class="quick-link-card" href="hero.html"><i class="bi bi-flag"></i><span class="qlabel">Hero Section</span><span class="qdesc">Homepage headline & CTAs</span></a>
        <a class="quick-link-card" href="services.html"><i class="bi bi-grid-3x3-gap"></i><span class="qlabel">Services</span><span class="qdesc">Pricing cards & offerings</span></a>
        <a class="quick-link-card" href="portfolio.html"><i class="bi bi-briefcase"></i><span class="qlabel">Portfolio</span><span class="qdesc">Client project showcase</span></a>
        <a class="quick-link-card" href="testimonials.html"><i class="bi bi-chat-quote"></i><span class="qlabel">Testimonials</span><span class="qdesc">Client quotes</span></a>
        <a class="quick-link-card" href="faq.html"><i class="bi bi-question-circle"></i><span class="qlabel">FAQ</span><span class="qdesc">Common questions</span></a>
        <a class="quick-link-card" href="navigation.html"><i class="bi bi-list-ul"></i><span class="qlabel">Navigation</span><span class="qdesc">Sidebar & footer tabs</span></a>
      </div>
    `;

    const tables = [
      { key: "services", label: "Services", icon: "bi-grid-3x3-gap", href: "services.html" },
      { key: "portfolio_projects", label: "Portfolio Projects", icon: "bi-briefcase", href: "portfolio.html" },
      { key: "testimonials", label: "Testimonials", icon: "bi-chat-quote", href: "testimonials.html" },
      { key: "faq", label: "FAQ Entries", icon: "bi-question-circle", href: "faq.html" },
      { key: "navigation", label: "Nav Items", icon: "bi-list-ul", href: "navigation.html" },
    ];

    const results = await Promise.all(tables.map((t) => AdminApi.count(t.key)));

    const grid = document.getElementById("statGrid");
    grid.innerHTML = tables
      .map((t, i) => {
        const { count, error } = results[i];
        return `
          <div class="stat-card">
            <div class="stat-icon"><i class="bi ${t.icon}"></i></div>
            <div class="stat-value">${error ? "—" : count}</div>
            <div class="stat-label">${t.label}</div>
            <a href="${t.href}" class="stat-link">Manage <i class="bi bi-arrow-right"></i></a>
          </div>`;
      })
      .join("");

    const anyError = results.find((r) => r.error);
    if (anyError) {
      DashToast.error("Some counts failed to load: " + anyError.error.message);
    }
  }
</script>
</body>
</html>

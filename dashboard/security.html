<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security & Audit · CUDFIRM Admin</title><meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap">
<link rel="stylesheet" href="css/dashboard.css"></head><body class="dash-body"><div id="dash-shell"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script>
<script src="js/dash-utils.js"></script><script src="js/permissions.js"></script><script src="js/auth-guard.js"></script>
<script src="js/layout.js"></script><script src="js/dashboard-api.js"></script><script src="js/security-api.js"></script><script src="js/pages/security-page.js"></script>
<script>
DashAuth.onReady(async (user, profile) => {
  try {
    if (profile && window.DashPermissions) DashPermissions.setProfile(profile);
    DashLayout.render({ active: "security", title: "Security & Audit", icon: "bi-shield-lock" });
    await SecurityPage.init();
  } catch (error) {
    console.error("[security] page startup failed:", error);
    const root = document.getElementById("page-content");
    if (root) root.innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><h2>Security & Audit could not load</h2><p>Refresh the page and try again.</p></div>';
  }
});
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login · CUDFIRM Dashboard</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" />
<link rel="stylesheet" href="css/dashboard.css" />

<!-- Vercel Speed Insights -->
<script src="../js/speed-insights.js" defer></script>
</head>
<body class="dash-body">

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="mark">C</div>
      <div class="name">CUDFIRM</div>
    </div>

    <h1>Admin Dashboard</h1>
    <p class="sub">Sign in to manage your website content.</p>

    <div class="dash-alert error" id="loginError"></div>
    <div class="dash-alert success" id="loginNotice"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" required autocomplete="username" placeholder="you@cudfirm.com">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-brand w-100 justify-content-center py-2" id="loginBtn">
        <i class="bi bi-box-arrow-in-right"></i> Sign in
      </button>
    </form>

    <p class="form-hint mt-3 mb-0">
      Admin accounts are created in the Supabase dashboard (Authentication → Users). There is no public sign-up.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<script>
  const errorBox = document.getElementById("loginError");
  const noticeBox = document.getElementById("loginNotice");
  const loginBtn = document.getElementById("loginBtn");

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add("show");
    noticeBox.classList.remove("show");
  }
  function showNotice(msg) {
    noticeBox.textContent = msg;
    noticeBox.classList.add("show");
    errorBox.classList.remove("show");
  }

  // If already signed in, skip straight to the dashboard.
  (async () => {
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session) {
      window.location.replace("home.html");
    }
  })();

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    noticeBox.classList.remove("show");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginBtn.disabled = true;
    loginBtn.innerHTML = `<i class="bi bi-arrow-repeat"></i> Signing in…`;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    loginBtn.disabled = false;
    loginBtn.innerHTML = `<i class="bi bi-box-arrow-in-right"></i> Sign in`;

    if (error) {
      showError(error.message || "Could not sign in. Check your email and password.");
      return;
    }

    showNotice("Signed in — redirecting…");
    window.location.replace("home.html");
  });
</script>
</body>
</html>

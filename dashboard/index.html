<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login · CUDFIRM Dashboard</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" />
<link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="dash-body">

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="mark">C</div>
      <div class="name">CUDFIRM</div>
    </div>

    <h1>Admin Dashboard</h1>
    <p class="sub">Sign in to manage your website content.</p>

    <div class="dash-alert error" id="loginError" role="alert"></div>
    <div class="dash-alert success" id="loginNotice" role="status" aria-live="polite"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" required autocomplete="username" placeholder="you@cudfirm.com">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-brand w-100 justify-content-center py-2" id="loginBtn">
        <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> <span class="btn-label">Sign in</span>
      </button>
    </form>

    <p class="form-hint mt-3 mb-0">
      Admin accounts are created in the Supabase dashboard (Authentication → Users). There is no public sign-up.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="js/dash-utils.js"></script>

<script>
  const errorBox = document.getElementById("loginError");
  const noticeBox = document.getElementById("loginNotice");
  const loginBtn = document.getElementById("loginBtn");
  let isSigningIn = false;

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add("show");
    noticeBox.classList.remove("show");
  }
  function showNotice(msg) {
    noticeBox.textContent = msg;
    noticeBox.classList.add("show");
    errorBox.classList.remove("show");
  }

  async function recordLoginEvent(eventType, email, success, reason) {
    try {
      await Promise.race([
        supabaseClient.rpc("record_auth_security_event", {
          p_event_type: eventType,
          p_email: email || null,
          p_success: success,
          p_details: reason ? { reason } : {},
          p_user_agent: navigator.userAgent || null,
        }),
        new Promise((resolve) => window.setTimeout(resolve, 1500)),
      ]);
    } catch (auditError) {
      // Security logging must never prevent sign-in or show a second error.
      console.warn("[security] login event was not recorded:", auditError);
    }
  }

  // If already signed in, skip straight to the dashboard.
  (async () => {
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session) {
      window.location.replace("home.html");
    }
  })();

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (isSigningIn) return;

    errorBox.classList.remove("show");
    noticeBox.classList.remove("show");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    isSigningIn = true;
    loginBtn.disabled = true;
    loginBtn.querySelector(".btn-label").textContent = "Signing in…";

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    isSigningIn = false;
    loginBtn.disabled = false;
    loginBtn.querySelector(".btn-label").textContent = "Sign in";

    if (error) {
      // Supabase's own auth messages (e.g. "Invalid login credentials")
      // are already written for end users — only network/server-level
      // failures get remapped to a friendlier message here.
      const raw = (error.message || "").toLowerCase();
      const isInfra = !navigator.onLine || raw.includes("fetch") || raw.includes("network") || (error.status && error.status >= 500);
      const reason = isInfra ? "network_or_service_error" : "invalid_credentials";
      void recordLoginEvent("login_failed", email, false, reason);
      showError(isInfra ? DashError.friendly(error, "Could not sign in. Please try again.") : error.message || "Could not sign in. Check your email and password.");
      return;
    }

    await recordLoginEvent("login_success", email, true, null);
    showNotice("Signed in — redirecting…");
    window.location.replace("home.html");
  });
</script>
</body>
</html>
